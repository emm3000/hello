name: Release build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upload-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload_release_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_CODE_FLOOR: 260
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Refuse a version code Play has already seen
        run: |
          if [ "$VERSION_CODE" -lt "$VERSION_CODE_FLOOR" ]; then
            echo "VERSION_CODE $VERSION_CODE is below the floor $VERSION_CODE_FLOOR: the run counter was reset" >&2
            exit 1
          fi

      - name: Derive the version name from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create keystore.properties file
        env:
          KEYSTORE_PROPERTIES: ${{ secrets.JUST_VERONICA }}
        run: printf '%s' "$KEYSTORE_PROPERTIES" > keystore.properties

      - name: Decode Keystore
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          mkdir -p key
          printf '%s' "$APP_KEY" | base64 --decode > key/just_chill_key.p12

      - name: Provision google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON is empty: a release must not ship with the dummy Firebase project" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Provision Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: printf 'supabase.url=%s\nsupabase.publishableKey=%s\n' "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > local.properties

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify and build the release
        run: >-
          ./gradlew
          detekt
          testDebugUnitTest
          :domain:test
          :data:verifySqlDelightMigration
          bundleRelease
          assembleRelease

      - name: Locate the release artifacts
        id: artifacts
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          if [ -z "$apk" ]; then
            echo "No release APK found" >&2
            exit 1
          fi
          aab=$(find app/build/outputs/bundle/release -name '*.aab' -type f | head -1)
          if [ -z "$aab" ]; then
            echo "No release AAB found" >&2
            exit 1
          fi
          echo "apk=$apk" >> $GITHUB_OUTPUT
          echo "apk_size=$(ls -lh "$apk" | awk '{print $5}')" >> $GITHUB_OUTPUT
          echo "aab=$aab" >> $GITHUB_OUTPUT
          mapping=app/build/outputs/mapping/release/mapping.txt
          if [ ! -f "$mapping" ]; then
            echo "No R8 mapping found" >&2
            exit 1
          fi
          echo "mapping=$mapping" >> $GITHUB_OUTPUT

      - name: Upload the Play bundle as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: hello-release-${{ github.run_number }}
          path: ${{ steps.artifacts.outputs.aab }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload the release APK to Firebase App Distribution
        if: github.ref == 'refs/heads/main'
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1.7.1
        with:
          appId: ${{secrets.FIREBASE_RELEASE_APP_ID}}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: Hello
          file: ${{ steps.artifacts.outputs.apk }}
          releaseNotes: |
            ${{ github.event.head_commit.message || 'workflow_dispatch' }}
            ${{ github.event.compare || github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            Branch: ${{ github.ref_name }}  ·  ${{ github.actor }}  ·  ${{ env.date_today }}
            versionCode: ${{ github.run_number }}
            APK: ${{ steps.artifacts.outputs.apk_size }}

      - name: Upload the Play bundle to the internal testing track
        if: startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.emm.hello
          releaseFiles: ${{ steps.artifacts.outputs.aab }}
          releaseName: ${{ github.ref_name }} (${{ github.run_number }})
          track: internal
          status: draft
          mappingFile: ${{ steps.artifacts.outputs.mapping }}
