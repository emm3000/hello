name: Android Action Generated APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload_release_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Create keystore.properties file
        run: echo "${{ secrets.JUST_VERONICA }}" > keystore.properties

      - name: Decode Keystore
        run: |
          mkdir -p key
          echo "${{ secrets.APP_KEY }}" | base64 --decode > key/just_chill_key.p12

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --ignore-garbage --decode > app/google-services.json

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run tests and build APK
        run: ./gradlew testDebugUnitTest assembleStaging --build-cache

      - name: Get Staging APK path and size
        id: releaseApkPath
        run: |
          apk=$(find app/build/outputs/apk/staging/*.apk)
          echo "apk=$apk" >> $GITHUB_OUTPUT
          echo "size=$(ls -lh "$apk" | awk '{print $5}')" >> $GITHUB_OUTPUT

      - name: Upload Release to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.1
        with:
          appId: ${{secrets.FIREBASE_RELEASE_APP_ID}}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: Hello
          file: ${{ steps.releaseApkPath.outputs.apk }}
          releaseNotes: |
            ${{ github.event.head_commit.message || 'workflow_dispatch' }}
            ${{ github.event.compare || github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            Branch: ${{ github.ref_name }}  ·  ${{ github.actor }}  ·  ${{ env.date_today }}
            APK: ${{ steps.releaseApkPath.outputs.size }}
